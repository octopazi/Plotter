name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          python scripts/validate_version.py --expected $version --changelog CHANGELOG.md --release-notes RELEASE_NOTES.md
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $env:PLOTTER_VERSION = "${{ env.VERSION }}"
          python -m PyInstaller --clean --noconfirm main.spec

      - name: Archive build output
        shell: pwsh
        run: |
          $sourceDir = "dist/Plotter-${{ env.VERSION }}"
          $zipPath = "dist/Plotter-${{ env.VERSION }}.zip"
          Compress-Archive -Path "$sourceDir/*" -DestinationPath $zipPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plotter-${{ env.VERSION }}
          path: dist/Plotter-${{ env.VERSION }}.zip

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Plotter v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(env.VERSION, '-alpha') }}
          files: |
            dist/Plotter-${{ env.VERSION }}.zip
